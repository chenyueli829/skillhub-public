<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillHub Public — Creative Voltage</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --stage-bg:#0a0a14; --ease:cubic-bezier(0.16,1,0.3,1); }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden;background:var(--stage-bg)}
    .deck-viewport{position:fixed;inset:0;overflow:hidden}
    .deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
    .slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:flex}
    .panel-left{width:960px;background:#0066ff;position:relative;padding:80px;display:flex;flex-direction:column;justify-content:flex-end}
    .panel-left::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,rgba(212,255,0,0.15),transparent 50%),repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 6px)}
    .panel-right{flex:1;background:#1a1a2e;padding:80px;display:flex;flex-direction:column;justify-content:center;position:relative}
    .panel-right::before{content:'';position:absolute;top:80px;right:80px;width:200px;height:200px;border:3px solid #d4ff00;border-radius:50%;opacity:0.3}
    .badge{display:inline-block;background:#d4ff00;color:#1a1a2e;font-family:'Space Mono',monospace;font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;padding:10px 18px;margin-bottom:32px;width:fit-content}
    .panel-left h1{font-family:'Syne','Noto Sans SC',sans-serif;font-size:96px;font-weight:800;line-height:0.92;color:#fff;position:relative;z-index:1}
    .script{font-family:'Space Mono',monospace;font-style:italic;font-size:28px;color:#d4ff00;margin-top:20px;position:relative;z-index:1}
    .panel-right h2{font-family:'Syne','Noto Sans SC',sans-serif;font-size:42px;color:#fff;line-height:1.2;margin-bottom:32px}
    .panel-right p{font-family:'Space Mono','Noto Sans SC',monospace;font-size:20px;color:rgba(255,255,255,0.65);line-height:1.7;max-width:680px}
    .stat-row{display:flex;gap:48px;margin-top:48px}
    .stat{font-family:'Syne',sans-serif;font-size:56px;font-weight:800;color:#d4ff00;line-height:1}
    .stat small{display:block;font-family:'Space Mono',monospace;font-size:12px;color:rgba(255,255,255,0.45);letter-spacing:0.1em;margin-top:8px}
    .reveal{opacity:0;transform:translateY(20px);animation:rise .65s var(--ease) forwards}
    .reveal:nth-child(2){animation-delay:.1s}.reveal:nth-child(3){animation-delay:.2s}.reveal:nth-child(4){animation-delay:.3s}
    @keyframes rise{to{opacity:1;transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){.reveal{animation:none;opacity:1;transform:none}}
  </style>
</head>
<body>
  <div class="deck-viewport"><main class="deck-stage" id="stage">
    <section class="slide">
      <div class="panel-left">
        <span class="badge reveal">Skill Library</span>
        <h1 class="reveal">SkillHub<br>Public</h1>
        <p class="script reveal">// 让 Agent 按流程办事</p>
      </div>
      <div class="panel-right">
        <h2 class="reveal">精选 · 归档 · 验证</h2>
        <p class="reveal">Cursor · Claude Code · OpenClaw · Hermes — 一个 GitHub 链接，Agent 自己安装</p>
        <div class="stat-row reveal">
          <div class="stat">200+<small>SKILLS</small></div>
          <div class="stat">63<small>CURATED</small></div>
        </div>
      </div>
    </section>
  </main></div>
  <script>
    const s=document.getElementById('stage');
    const scale=()=>{const f=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`;};
    scale();addEventListener('resize',scale);
  </script>
</body>
</html>
