    // in its own realm while staying same-origin with the parent (so asset
    // blob URLs load and parent.location is writable).

    }

    var navGen = 0;
    function navigate() {
      var r = route();
      var id = Object.prototype.hasOwnProperty.call(pages, r.id) ? r.id : entryId;

人想点一下的小心思。<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; margin-top: 64px;\">\n        <div style=\"border-top: 2px solid #0b0b0c; padding-top: 16px;\"><div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.1em; color:#9a9a96; margin-bottom:8px;\">个性<\u002Fdiv><div style=\"font-size:17px; line-height:1.5; color:#3a3a37;\">理性、有条理，但不冷冰冰 —— 一只猫的松弛感。<\u002Fdiv><\u002Fdiv>\n        <div style=\"border-top: 2px solid #0b0b0c; padding-top: 16px;\"><div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.1em; color:#9a9a96; margin-bottom:8px;\">语气<\u002Fdiv><div style=\"font-size:17px; line-height:1.5; color:#3a3a37;\">少废话、讲重点，偶尔抖个程序员/产品梗。<\u002Fdiv><\u002Fdiv>\n        <div style=\"border-top: 2px solid #0b0b0c; padding-top: 16px;\"><div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.1em; color:#9a9a96; margin-bottom:8px;\">符号<\u002Fdiv><div style=\"font-size:17px; line-height:1.5; color:#3a3a37;\">一只猫，纯黑白灰，可缩到 16px 仍能认出。<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 02 LOGO 探索 ============ -->\n  <section data-screen-label=\"Logo探索\" style=\"background: #f4f4f3; color: #0b0b0c;\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 88px 48px;\">\n      <div style=\"font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.22em; color: #9a9a96; text-transform: uppercase; margin-bottom: 16px;\">02 — 符号方向 / Marks<\u002Fdiv>\n      <p style=\"font-size: 17px; color: #6a6a66; max-width: 34em; margin: 0 0 48px; line-height: 1.55;\">六个方向，从最克制到最有梗。猫是统一母题，黑白灰是统一规则。看看哪个你想点一下。<\u002Fp>\n\n      <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;\">\n\n        <div style=\"background:#fff; border-radius:18px; padding:36px 28px 28px; transition: transform .16s ease, box-shadow .16s ease;\" style-hover=\"transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.08);\">\n          <div style=\"height: 150px; display:flex; align-items:center; justify-content:center;\">\n            <svg viewBox=\"0 0 200 200\" width=\"118\" height=\"118\" fill=\"#0b0b0c\"><polygon points=\"40,86 56,12 108,62\"><\u002Fpolygon><polygon points=\"160,86 144,12 92,62\"><\u002Fpolygon><circle cx=\"100\" cy=\"118\" r=\"62\"><\u002Fcircle><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.14em; color:#b3b3af; margin: 18px 0 6px;\">A — SOLID<\u002Fdiv>\n          <div style=\"font-size:18px; font-weight:600; margin-bottom:6px;\">实心剪影<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.5; color:#7a7a76;\">最克制、最高端。极小尺寸下最稳，适合 favicon、水印。<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff; border-radius:18px; padding:36px 28px 28px; transition: transform .16s ease, box-shadow .16s ease;\" style-hover=\"transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.08);\">\n          <div style=\"height: 150px; display:flex; align-items:center; justify-content:center;\">\n            <svg viewBox=\"0 0 200 200\" width=\"118\" height=\"118\" fill=\"none\" stroke=\"#0b0b0c\" stroke-width=\"9\" stroke-linejoin=\"round\"><polygon points=\"44,84 58,20 106,62\"><\u002Fpolygon><polygon points=\"156,84 142,20 94,62\"><\u002Fpolygon><circle cx=\"100\" cy=\"116\" r=\"58\"><\u002Fcircle><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.14em; color:#b3b3af; margin: 18px 0 6px;\">B — LINE<\u002Fdiv>\n          <div style=\"font-size:18px; font-weight:600; margin-bottom:6px;\">线条轮廓<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.5; color:#7a7a76;\">更轻、更精致。线性气质，配大量留白很高级。<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff; border-radius:18px; padding:36px 28px 28px; transition: transform .16s ease, box-shadow .16s ease;\" style-hover=\"transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.08);\">\n          <div style=\"height: 150px; display:flex; align-items:center; justify-content:center;\">\n            <svg viewBox=\"0 0 200 200\" width=\"118\" height=\"118\" fill=\"#0b0b0c\" shape-rendering=\"crispEdges\"><rect x=\"30\" y=\"10\" width=\"28\" height=\"28\"><\u002Frect><rect x=\"142\" y=\"10\" width=\"28\" height=\"28\"><\u002Frect><rect x=\"30\" y=\"38\" width=\"140\" height=\"132\"><\u002Frect><rect x=\"62\" y=\"78\" width=\"24\" height=\"24\" fill=\"#fff\"><\u002Frect><rect x=\"114\" y=\"78\" width=\"24\" height=\"24\" fill=\"#fff\"><\u002Frect><rect x=\"86\" y=\"118\" width=\"28\" height=\"14\" fill=\"#fff\"><\u002Frect><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.14em; color:#b3b3af; margin: 18px 0 6px;\">C — PIXEL<\u002Fdiv>\n          <div style=\"font-size:18px; font-weight:600; margin-bottom:6px;\">像素猫<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.5; color:#7a7a76;\">程序员梗，技术味十足。低保真的怪诞感，识别度高。<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff; border-radius:18px; padding:36px 28px 28px; transition: transform .16s ease, box-shadow .16s ease;\" style-hover=\"transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.08);\">\n          <div style=\"height: 150px; display:flex; align-items:center; justify-content:center;\">\n            <div style=\"font-family:'Space Mono',monospace; font-weight:700; font-size:28px; color:#0b0b0c; letter-spacing:-0.02em;\">=^·ﻌ·^=<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.14em; color:#b3b3af; margin: 18px 0 6px;\">D — KAOMOJI<\u002Fdiv>\n          <div style=\"font-size:18px; font-weight:600; margin-bottom:6px;\">颜文字猫<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.5; color:#7a7a76;\">能打出来、能互动。极客气质，可当签名、口头禅。<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff; border-radius:18px; padding:36px 28px 28px; transition: transform .16s ease, box-shadow .16s ease;\" style-hover=\"transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.08);\">\n          <div style=\"height: 150px; display:flex; align-items:center; justify-content:center;\">\n            <svg viewBox=\"0 0 200 200\" width=\"118\" height=\"118\"><polygon points=\"46,88 60,26 104,64\" fill=\"#0b0b0c\"><\u002Fpolygon><polygon points=\"154,88 140,26 96,64\" fill=\"#0b0b0c\"><\u002Fpolygon><circle cx=\"100\" cy=\"116\" r=\"60\" fill=\"#0b0b0c\"><\u002Fcircle><circle cx=\"80\" cy=\"106\" r=\"7\" fill=\"#fff\"><\u002Fcircle><circle cx=\"120\" cy=\"106\" r=\"7\" fill=\"#fff\"><\u002Fcircle><polygon points=\"100,122 92,132 108,132\" fill=\"#fff\"><\u002Fpolygon><line x1=\"40\" y1=\"124\" x2=\"68\" y2=\"120\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fline><line x1=\"160\" y1=\"124\" x2=\"132\" y2=\"120\" stroke=\"#fff\" stroke-width=\"3\" stroke-linecap=\"round\"><\u002Fline><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.14em; color:#b3b3af; margin: 18px 0 6px;\">E — FACE<\u002Fdiv>\n          <div style=\"font-size:18px; font-weight:600; margin-bottom:6px;\">圆点表情<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.5; color:#7a7a76;\">有眼神、有胡须，最亲和。适合头像、表情包延展。<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff; border-radius:18px; padding:36px 28px 28px; transition: transform .16s ease, box-shadow .16s ease;\" style-hover=\"transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.08);\">\n          <div style=\"height: 150px; display:flex; align-items:center; justify-content:center;\">\n            <svg viewBox=\"0 0 200 200\" width=\"118\" height=\"118\"><circle cx=\"100\" cy=\"100\" r=\"94\" fill=\"#0b0b0c\"><\u002Fcircle><g fill=\"#fff\"><polygon points=\"62,96 74,48 110,86\"><\u002Fpolygon><polygon points=\"138,96 126,48 90,86\"><\u002Fpolygon><circle cx=\"100\" cy=\"120\" r=\"40\"><\u002Fcircle><\u002Fg><circle cx=\"86\" cy=\"114\" r=\"5\" fill=\"#0b0b0c\"><\u002Fcircle><circle cx=\"114\" cy=\"114\" r=\"5\" fill=\"#0b0b0c\"><\u002Fcircle><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.14em; color:#b3b3af; margin: 18px 0 6px;\">F — BADGE<\u002Fdiv>\n          <div style=\"font-size:18px; font-weight:600; margin-bottom:6px;\">负形徽章<\u002Fdiv>\n          <div style=\"font-size:14px; line-height:1.5; color:#7a7a76;\">圆形容器内的负空间猫。当头像、印章、贴纸都成立。<\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 03 颜色 ============ -->\n  <section data-screen-label=\"颜色\" style=\"background: #0b0b0c; color: #fff;\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 88px 48px;\">\n      <div style=\"font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.22em; color: #6b6b68; text-transform: uppercase; margin-bottom: 16px;\">03 — 颜色 / Palette<\u002Fdiv>\n      <p style=\"font-size: 17px; color: #a5a5a1; max-width: 34em; margin: 0 0 48px; line-height: 1.55;\">纯中性灰阶，零彩色。规则简单：黑做主、白做底、灰做层级。克制就是高级。<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px;\">\n        <div><div style=\"height:120px; border-radius:12px; background:#0b0b0c; border:1px solid #26262a;\"><\u002Fdiv><div style=\"font-family:'Space Mono',monospace; font-size:11px; color:#cfcfcb; margin-top:10px;\">Ink<\u002Fdiv><div style=\"font-family:'Space Mono',monospace; font-size:11px; color:#6b6b68;\">#0B0B0C<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"height:120px; border-radius:12px; background:#3a3a37;\"><\u002Fdiv><div style=\"font-family:'Space Mono',monospace; font-size:11px; color:#cfcfcb; margin-top:10px;\">Slate<\u002Fdiv><div style=\"font-family:'Space Mono',monospace; font-size:11px; color:#6b6b68;\">#3A3A37<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"height:120px; border-radius:12px; background:#7a7a76;\"><\u002Fdiv><div style=\"font-family:'Space Mono',monospace; font-size:11px; color:#cfcfcb; margin-top:10px;\">Mid<\u002Fdiv><div style=\"font-family:'Space Mono',monospace; font-size:11px; color:#6b6b68;\">#7A7A76<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"height:120px; border-radius:12px; background:#cfcfcb;\"><\u002Fdiv><div style=\"font-family:'Space Mono',monospace; font-size:11px; color:#cfcfcb; margin-top:10px;\">Mist<\u002Fdiv><div style=\"font-family:'Space Mono',monospace; font-size:11px; color:#6b6b68;\">#CFCFCB<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"height:120px; border-radius:12px; background:#f4f4f3;\"><\u002Fdiv><div style=\"font-family:'Space Mono',monospace; font-size:11px; color:#cfcfcb; margin-top:10px;\">Fog<\u002Fdiv><div style=\"font-family:'Space Mono',monospace; font-size:11px; color:#6b6b68;\">#F4F4F3<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"height:120px; border-radius:12px; background:#fff;\"><\u002Fdiv><div style=\"font-family:'Space Mono',monospace; font-size:11px; color:#cfcfcb; margin-top:10px;\">Paper<\u002Fdiv><div style=\"font-family:'Space Mono',monospace; font-size:11px; color:#6b6b68;\">#FFFFFF<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 04 字体 ============ -->\n  <section data-screen-label=\"字体\" style=\"background: #fff; color: #0b0b0c;\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 88px 48px;\">\n      <div style=\"font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.22em; color: #9a9a96; text-transform: uppercase; margin-bottom: 16px;\">04 — 字体 / Type<\u002Fdiv>\n      <p style=\"font-size: 17px; color: #6a6a66; max-width: 34em; margin: 0 0 56px; line-height: 1.55;\">一个有性格的几何无衬线做主角，一个等宽体做标签/代码味点缀 —— 同源气质，理性又有极客感。<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 56px;\">\n        <div style=\"border-top: 2px solid #0b0b0c; padding-top: 24px;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:baseline; margin-bottom:24px;\"><span style=\"font-size:20px; font-weight:600;\">Space Grotesk<\u002Fspan><span style=\"font-family:'Space Mono',monospace; font-size:12px; color:#9a9a96;\">Display<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:88px; font-weight:700; line-height:1; letter-spacing:-0.03em;\">Aa<\u002Fdiv>\n          <div style=\"font-size:24px; font-weight:500; margin-top:16px;\">产品 · 技术 · 一只猫<\u002Fdiv>\n          <div style=\"font-family:'Space Grotesk',sans-serif; font-size:15px; color:#7a7a76; margin-top:16px; line-height:1.5;\">用于大标题、名字、关键句。粗重、几何、自信。<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top: 2px solid #0b0b0c; padding-top: 24px;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:baseline; margin-bottom:24px;\"><span style=\"font-size:20px; font-weight:600; font-family:'Space Mono',monospace;\">Space Mono<\u002Fspan><span style=\"font-family:'Space Mono',monospace; font-size:12px; color:#9a9a96;\">Label / Mono<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:88px; font-weight:700; line-height:1; font-family:'Space Mono',monospace;\">Aa<\u002Fdiv>\n          <div style=\"font-size:22px; font-weight:400; margin-top:16px; font-family:'Space Mono',monospace;\">=^·ﻌ·^= product@cat<\u002Fdiv>\n          <div style=\"font-family:'Space Grotesk',sans-serif; font-size:15px; color:#7a7a76; margin-top:16px; line-height:1.5;\">用于标签、编号、署名、彩蛋。带来代码与极客的味道。<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ 05 应用 ============ -->\n  <section data-screen-label=\"应用\" style=\"background: #f4f4f3; color: #0b0b0c;\">\n    <div style=\"max-width: 1120px; margin: 0 auto; padding: 88px 48px 104px;\">\n      <div style=\"font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 0.22em; color: #9a9a96; text-transform: uppercase; margin-bottom: 16px;\">05 — 应用 / In Use<\u002Fdiv>\n      <p style=\"font-size: 17px; color: #6a6a66; max-width: 34em; margin: 0 0 48px; line-height: 1.55;\">用「实心剪影 A」快速看一眼落地的样子 —— 头像、名片、PPT 封面。<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 24px;\">\n\n        <!-- avatar -->\n        <div style=\"background:#fff; border-radius:18px; padding:36px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;\">\n          <div style=\"width:120px; height:120px; border-radius:50%; background:#0b0b0c; display:flex; align-items:center; justify-content:center;\">\n            <svg viewBox=\"0 0 200 200\" width=\"72\" height=\"72\" fill=\"#fff\"><polygon points=\"40,86 56,12 108,62\"><\u002Fpolygon><polygon points=\"160,86 144,12 92,62\"><\u002Fpolygon><circle cx=\"100\" cy=\"118\" r=\"62\"><\u002Fcircle><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"text-align:center;\"><div style=\"font-weight:600; font-size:16px;\">{{ handle }}<\u002Fdiv><div style=\"font-family:'Space Mono',monospace; font-size:12px; color:#9a9a96; margin-top:4px;\">头像 / Avatar<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- business card -->\n        <div style=\"background:#0b0b0c; border-radius:18px; padding:40px; color:#fff; display:flex; flex-direction:column; justify-content:space-between; min-height:240px;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:flex-start;\">\n            <svg viewBox=\"0 0 200 200\" width=\"46\" height=\"46\" fill=\"#fff\"><polygon points=\"40,86 56,12 108,62\"><\u002Fpolygon><polygon points=\"160,86 144,12 92,62\"><\u002Fpolygon><circle cx=\"100\" cy=\"118\" r=\"62\"><\u002Fcircle><\u002Fsvg>\n            <span style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.1em; color:#6b6b68;\">=^·ﻌ·^=<\u002Fspan>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:26px; font-weight:700; letter-spacing:-0.02em;\">{{ handle }}<\u002Fdiv>\n            <div style=\"font-size:14px; color:#a5a5a1; margin-top:6px;\">AI Product Manager<\u002Fdiv>\n            <div style=\"font-family:'Space Mono',monospace; font-size:12px; color:#6b6b68; margin-top:16px;\">名片 / Business Card<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n\n      <!-- ppt cover -->\n      <div style=\"background:#fff; border-radius:18px; margin-top:24px; padding:0; overflow:hidden; display:grid; grid-template-columns: 1fr 1fr;\">\n        <div style=\"padding:48px;\">\n          <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.14em; color:#9a9a96; margin-bottom:20px;\">分享 / TALK · 2026<\u002Fdiv>\n          <div style=\"font-size:38px; font-weight:700; letter-spacing:-0.02em; line-height:1.1;\">AI 时代的<br>产品经理修炼<\u002Fdiv>\n          <div style=\"font-size:15px; color:#7a7a76; margin-top:18px;\">{{ handle }} · 一只猫旁观<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0b0b0c; display:flex; align-items:center; justify-content:center; min-height:220px;\">\n          <svg viewBox=\"0 0 200 200\" width=\"120\" height=\"120\" fill=\"#fff\"><polygon points=\"40,86 56,12 108,62\"><\u002Fpolygon><polygon points=\"160,86 144,12 92,62\"><\u002Fpolygon><circle cx=\"100\" cy=\"118\" r=\"62\"><\u002Fcircle><\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- footer -->\n  <section style=\"background:#0b0b0c; color:#6b6b68; text-align:center; padding:40px;\">\n    <div style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.14em;\">品牌脑暴板 · 第一轮方向 · 选个你想点的猫 =^·ﻌ·^=<\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1120,&quot;height&quot;:900},&quot;handle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;产品经理与猫&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tagline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;一个懂产品、懂技术，养着一只猫的 AI 产品经理。这里分享我对产品、AI 和工作方式的思考。&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = { i: 0 };\n  names = ['实心剪影', '线条轮廓', '像素猫', '颜文字', '圆点表情', '负形徽章'];\n  renderVals() {\n    const i = this.state.i;\n    const pad = (n) => String(n + 1).padStart(2, '0');\n    return {\n      handle: this.props.handle ?? '产品经理与猫',\n      tagline: this.props.tagline ?? '一个懂产品、懂技术，养着一只猫的 AI 产品经理。这里分享我对产品、AI 和工作方式的思考。',\n      cycle: () => this.setState(s => ({ i: (s.i + 1) % 6 })),\n      is0: i === 0, is1: i === 1, is2: i === 2, is3: i === 3, is4: i === 4, is5: i === 5,\n      featuredNo: pad(i),\n      featuredName: this.names[i],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"},"entry":"_standalone_src.dc"}
